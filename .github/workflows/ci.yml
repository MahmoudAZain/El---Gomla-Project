name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, lint, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      # Next 16 no longer runs ESLint during `next build`, so this is the gate
      # that enforces the right-to-left rule (Constitution Principle III).
      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm run test

      - name: Build
        run: npm run build
        env:
          # Placeholders — the build must not require real credentials. Anything
          # that genuinely needs Supabase belongs in an integration test.
          NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-anon-key
          NEXT_PUBLIC_SITE_URL: http://localhost:3000
          # A distinctive value, so the bundle check below is searching for
          # something that could only have come from this build.
          SUPABASE_SERVICE_ROLE_KEY: ci-placeholder-service-role-key-do-not-ship
          CRON_SECRET: ci-placeholder-cron-secret-value

      # FR-066. The service-role key bypasses every RLS policy; if it ever
      # reached a browser bundle, every isolation guarantee would be void. Three
      # separate mechanisms are meant to prevent that — this proves they worked.
      - name: No secrets in the client bundle
        run: ./scripts/check-client-bundle.sh
        env:
          NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
          SUPABASE_SERVICE_ROLE_KEY: ci-placeholder-service-role-key-do-not-ship

  database:
    name: Database — pricing, orders, RLS, admin, lifecycle, reporting, search
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # A real Postgres, because the guarantees under test are RLS policies and a
    # locking transaction. Neither can be verified against a mock.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      PGHOST: 127.0.0.1
      PGPORT: '5432'
      PGUSER: postgres
      PGPASSWORD: postgres

    steps:
      - uses: actions/checkout@v4

      - name: Install psql
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      # Applies every migration from empty. A migration that only works against
      # an already-populated database is a broken migration.
      - name: SQL suites
        run: ./scripts/run-sql-tests.sh

      # What a deploy actually produces. Every suite above applies the seed as
      # well as the migrations, which is `supabase db reset` — but deploying
      # runs `supabase db push`, and that never applies the seed. This builds
      # the database the way production is built and checks it is usable on day
      # one: reference data present, no sample data, no default credentials.
      - name: Deploy path — migrations without the seed
        run: ./scripts/test-deploy-path.sh

      # SC-016: two simultaneous orders for the last unit of stock.
      - name: Concurrency
        run: ./scripts/test-concurrency.sh

      # Phone normalization exists in both TypeScript and SQL. Duplication is
      # deliberate; divergence would let one person register twice.
      - name: Phone normalization parity
        run: ./scripts/test-phone-parity.sh

  cloudflare:
    name: Cloudflare Workers bundle
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: verify

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Builds the Workers bundle without deploying. Catches adapter breakage
      # — a missing Node compatibility flag, an unsupported API — on the pull
      # request rather than at deploy time.
      - name: Build Workers bundle
        run: npm run cf:build
        env:
          NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-anon-key
          NEXT_PUBLIC_SITE_URL: http://localhost:3000
